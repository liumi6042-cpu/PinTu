<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>我的庭院 · 花园试玩</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span>❧</span><div>一起拼图<small>JIGSAW NOOK</small></div></div><nav><b>我的庭院</b><span class="preview">独立试玩 · 本地存档</span></nav><div class="header-actions"><button id="checkin">每日签到</button><button id="wallet">碎片 <strong id="coins">20</strong></button></div></header>
<main><canvas id="scene" aria-label="我的庭院，可拖动花田与物品，拖动空地移动视角，滚轮或双指缩放"></canvas><div class="intro"><small>A LITTLE PLACE TO BLOOM</small><h1>我的庭院</h1><p>在拼图与生活之间，种下一点美好。</p><span id="guide">点一块空花田，种下第一颗种子。</span></div><div class="side"><button id="egg" class="egg"><svg viewBox="90 6 350 388" aria-hidden="true"><image href="assets/eggs.webp" width="1983" height="793"/></svg><span>孵化小屋<b id="egg-progress">0 / 50%</b></span></button><button id="garden-event" class="event-entry"><span>✿ 七日花园礼</span><small>拼图集齐一套装饰</small></button><button id="album">花朵收藏册 <span id="album-count">0 / 50</span></button><button id="expand">扩建花田 <span id="bed-count">4 / 10</span></button></div><div id="selection" hidden></div><div class="zoom"><button id="minus" aria-label="缩小">−</button><span id="zoom-value">100%</span><button id="plus" aria-label="放大">＋</button><button id="fit">全景</button></div><div id="toast" role="status"></div></main>
<button id="dock-toggle" aria-expanded="false" aria-controls="inventory-dock">打开物品栏 ▴</button><section id="inventory-dock" class="dock" inert><div class="dock-head"><div class="tabs"><button data-tab="beds" class="active">我的花田</button><button data-tab="seeds">种子袋</button><button data-tab="flowers">成品花</button><button data-tab="decor">装饰仓库</button></div><div><label id="decor-series-control" hidden>系列 <select id="decor-series" aria-label="装饰系列"></select></label><button id="shop">种子与装饰兑换</button><button id="testing" class="quiet">测试工具</button></div></div><div id="shelf"></div><div class="dock-note"><span id="save-state">自动保存 · 离线也会生长</span><span>拖动时显示网格 · 家具可转向 · 花朵成熟不会枯萎</span></div></section>
<dialog id="modal"><button id="close" class="close" aria-label="关闭">×</button><div id="modal-body"></div></dialog><script type="module" src="app.mjs"></script></body></html>
