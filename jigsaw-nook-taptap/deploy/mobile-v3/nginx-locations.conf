# Add to the existing HTTPS virtual host only when this independent service is deployed.
# Keep /h5/, /taptap-play/ and the PC site's locations unchanged.
location = /taptap-mobile-v3 { return 302 /taptap-mobile-v3/; }
location ^~ /taptap-mobile-v3/ {
    proxy_pass http://127.0.0.1:3292/;
    proxy_set_header X-Jigsaw-Client-IP $remote_addr;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
# Apply with the upgraded backend in a coordinated deployment; not yet live.
location = /h5-mobile-v3/realtime {
    proxy_pass http://127.0.0.1:3292/h5/realtime;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Jigsaw-Client-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /h5-mobile-v3/ {
    client_max_body_size 3m;
    proxy_pass http://127.0.0.1:3292/h5/;
    proxy_set_header X-Jigsaw-Client-IP $remote_addr;
    proxy_read_timeout 70s;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
