# CANDIDATE ONLY: not installed and not syntax-checked by nginx.
# Insert inside the existing jigsawnook.online HTTPS server block.
# Keep the actual active upstream port, TLS, real-IP, auth and rate limits intact.
# Inspect nginx -T first for inherited gzip settings; do not blindly duplicate.
# This strict allowlist matches prepare-shared-client.mjs's current 9 files.
location ~ "^/shared-client/[a-f0-9]{16}/(?:game\.js|assets/audio/mobile-snap\.wav|assets/ui/b2-(?:core|task)-icons23\.png|art/b2-(?:supply-scenes|pixel-atlas)\.png|assets/fonts/(?:OFL-NotoSansSC\.txt|FONT-NOTICES\.md|jigsaw-ui-sc\.woff2))$" {
    root /srv/sites/jigsaw/current/dist/client;
    try_files $uri @jigsaw_shared_asset_not_found;

    # Do not add 'always': missing/denied files must not get a 1-year lifetime.
    add_header Cache-Control "public, max-age=31536000, immutable";
    # A location with add_header overrides parent add_header on common nginx versions.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Compress text only. Already-compressed WebP/PNG/WOFF2 are deliberately excluded.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types application/javascript text/javascript text/plain;
}

# Missing versions must not inherit a CDN's default error cache lifetime.
location @jigsaw_shared_asset_not_found {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 404;
}

