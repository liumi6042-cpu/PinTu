# API-only origin for Qiniu. IP origin + this Host/SNI avoids Cloudflare.
server {
    listen 80;
    listen [::]:80;
    server_name api.ymxc.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location / { return 301 https://api.ymxc.top$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.ymxc.top;
    ssl_certificate /etc/letsencrypt/live/api.ymxc.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ymxc.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location = /cdn-health.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }
    location ^~ /h5-mobile-v3/assets/puzzles/ {
        rewrite ^/h5-mobile-v3/assets/puzzles/(.*)$ /puzzles/$1 break;
        root /srv/sites/jigsaw-content/assets;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    location ^~ /h5-mobile-v3/ {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:3292/h5/;
        proxy_set_header X-Jigsaw-Client-IP $remote_addr;
        proxy_read_timeout 70s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}
