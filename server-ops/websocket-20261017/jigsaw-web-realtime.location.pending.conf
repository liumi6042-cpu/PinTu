# Local proposal only. Insert into the existing HTTPS jigsawnook.online server
# block at the next coordinated deployment. Match proxy_pass to that release's
# active Node port; 3104 is the last recorded production port, not a new switch.
location = /api/shared/realtime {
    proxy_http_version 1.1;
    proxy_set_header Host jigsawnook.online;
    proxy_set_header X-Forwarded-Host jigsawnook.online;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Puzzle-Country $jigsaw_ip_country;
    proxy_set_header CF-IPCountry "";
    proxy_set_header Forwarded "";
    proxy_set_header oai-authenticated-user-id "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3104;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
